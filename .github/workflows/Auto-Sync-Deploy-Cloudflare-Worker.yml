name: Auto Sync and Deploy

on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 时间 0 点 (北京时间早 8 点) 自动执行
  workflow_dispatch:    # 允许在 Actions 页面手动点击运行

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允许 GitHub Actions 推送代码
      # actions 读取仓库信息的默认权限通常已足够，无需额外声明

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main # 【注意】如果你的主分支叫 master，请修改为 master

      - name: Sync from upstream
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # 使用 GitHub 自动提供的 Token
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "正在获取上游仓库信息..."
          # 利用 GitHub API 自动查询当前 Fork 仓库的“父仓库（上游）”地址
          UPSTREAM_URL=$(gh api repos/${{ github.repository }} --jq '.parent.clone_url')

          # 安全校验：检查是否成功获取到了上游地址
          if [ -z "$UPSTREAM_URL" ] || [ "$UPSTREAM_URL" == "null" ]; then
            echo "错误：无法获取上游地址。请确保当前仓库是一个 Fork！"
            exit 1
          fi

          echo "自动获取到上游地址: $UPSTREAM_URL"
          git remote add upstream $UPSTREAM_URL
          git fetch upstream

          # 获取本地和上游最新提交的 Hash 值
          LOCAL_COMMIT=$(git rev-parse HEAD)
          UPSTREAM_COMMIT=$(git rev-parse upstream/main) # 【注意】若上游是 master 分支，请修改为 upstream/master

          if [ "$LOCAL_COMMIT" != "$UPSTREAM_COMMIT" ]; then
            echo "发现上游更新，正在合并..."
            git merge upstream/main --no-edit
            git push origin main
            echo "updated=true" >> $GITHUB_OUTPUT
          else
            echo "与上游保持同步，无新更新。"
            echo "updated=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Cloudflare Workers
        # 仅当同步步骤输出为 true，或你手动点击运行时，才会触发部署
        if: steps.sync.outputs.updated == 'true' || github.event_name == 'workflow_dispatch'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
